name: Deploy to EC2

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ec2-prod
      cancel-in-progress: true
    steps:
      - name: Deploy production API on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_PATH }}"
            git fetch origin master
            git reset --hard origin/master
            DEPLOY_BRANCH=master \
            PM2_APP_NAME=boramarcar-api \
            PM2_ECOSYSTEM=ecosystem.config.cjs \
            bash scripts/deploy.sh

  deploy-hml:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ec2-hml
      cancel-in-progress: true
    steps:
      - name: Deploy homologation API on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_PATH_HML }}"
            git fetch origin development
            git reset --hard origin/development
            DEPLOY_BRANCH=development \
            PM2_APP_NAME=hml-boramarcar-api \
            PM2_ECOSYSTEM=ecosystem.hml.config.cjs \
            bash scripts/deploy.sh
