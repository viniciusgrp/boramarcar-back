name: Deploy to EC2

on:
  push:
    branches:
      - master
      - development

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ec2-prod
      cancel-in-progress: true
    steps:
      - name: Deploy production API on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_PATH }}"
            git fetch origin master
            git reset --hard origin/master
            DEPLOY_BRANCH=master \
            PM2_APP_NAME=boramarcar-api \
            PM2_ECOSYSTEM=ecosystem.config.cjs \
            bash scripts/deploy.sh

  deploy-hml:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ec2-hml
      cancel-in-progress: true
    steps:
      - name: Deploy homologation API on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_PATH_HML }}"
            git fetch origin development
            git reset --hard origin/development
            DEPLOY_BRANCH=development \
            PM2_APP_NAME=hml-boramarcar-api \
            PM2_ECOSYSTEM=ecosystem.hml.config.cjs \
            bash scripts/deploy.sh
